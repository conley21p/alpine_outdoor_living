<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of an accessible bathroom with a curbless walk-in shower, grab bars and a fold-down bench">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3E86"/>
      <stop offset="100%" stop-color="#0D2350"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FB4F5" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#CFE0FB" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8FB4F5" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16306B"/>
      <stop offset="100%" stop-color="#0A1B3F"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F8FF"/>
      <stop offset="45%" stop-color="#B9CBE8"/>
      <stop offset="100%" stop-color="#8FA6C9"/>
    </linearGradient>
    <radialGradient id="sconce" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9B8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE9B8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tile" width="100" height="60" patternUnits="userSpaceOnUse">
      <rect width="100" height="60" fill="none"/>
      <path d="M0 0h100M0 60h100M0 0v60M100 0v60" stroke="#5B7FC4" stroke-opacity="0.16" stroke-width="2"/>
    </pattern>
    <pattern id="floorTile" width="120" height="70" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
      <path d="M0 0h120M0 70h120M0 0v70" stroke="#5B7FC4" stroke-opacity="0.13" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Room shell -->
  <rect width="1600" height="800" fill="url(#wall)"/>
  <rect width="1600" height="600" fill="url(#tile)"/>
  <rect y="600" width="1600" height="200" fill="url(#floor)"/>
  <rect y="600" width="1600" height="200" fill="url(#floorTile)"/>
  <rect y="592" width="1600" height="10" fill="#5B7FC4" opacity="0.22"/>

  <!-- Ambient light wash from the left -->
  <ellipse cx="250" cy="180" rx="420" ry="300" fill="url(#sconce)"/>

  <!-- ===== Curbless walk-in shower (right side) ===== -->
  <g>
    <!-- back wall panel of shower niche -->
    <rect x="980" y="120" width="520" height="480" fill="#102A5E" opacity="0.85"/>
    <rect x="980" y="120" width="520" height="480" fill="url(#tile)"/>

    <!-- recessed niche shelf -->
    <rect x="1040" y="250" width="150" height="90" rx="6" fill="#0A1F49"/>
    <rect x="1040" y="250" width="150" height="90" rx="6" fill="none" stroke="#7FA0DC" stroke-opacity="0.35" stroke-width="3"/>
    <rect x="1052" y="294" width="126" height="4" fill="#7FA0DC" opacity="0.35"/>

    <!-- glass panel -->
    <rect x="980" y="130" width="16" height="470" fill="url(#chrome)" opacity="0.9"/>
    <rect x="996" y="140" width="360" height="460" fill="url(#glass)"/>
    <rect x="996" y="140" width="360" height="460" fill="none" stroke="#CFE0FB" stroke-opacity="0.4" stroke-width="3"/>

    <!-- linear drain at the zero-threshold entry -->
    <rect x="1000" y="586" width="340" height="12" rx="6" fill="#9FB6D8" opacity="0.55"/>
    <g stroke="#0A1B3F" stroke-opacity="0.5" stroke-width="2">
      <path d="M1020 586v12M1060 586v12M1100 586v12M1140 586v12M1180 586v12M1220 586v12M1260 586v12M1300 586v12"/>
    </g>

    <!-- handheld shower on a slide bar -->
    <rect x="1400" y="180" width="10" height="240" rx="5" fill="url(#chrome)"/>
    <rect x="1388" y="196" width="34" height="16" rx="8" fill="url(#chrome)"/>
    <rect x="1388" y="300" width="34" height="20" rx="10" fill="url(#chrome)"/>
    <g transform="translate(1362 300)">
      <rect x="0" y="4" width="30" height="10" rx="5" fill="url(#chrome)"/>
      <circle cx="-6" cy="9" r="14" fill="url(#chrome)"/>
      <circle cx="-6" cy="9" r="8" fill="#0D2350" opacity="0.35"/>
    </g>
    <!-- thermostatic valve -->
    <circle cx="1300" cy="330" r="22" fill="url(#chrome)"/>
    <circle cx="1300" cy="330" r="10" fill="#0D2350" opacity="0.35"/>

    <!-- fold-down bench -->
    <g>
      <rect x="1030" y="440" width="200" height="22" rx="8" fill="#D8C3A2"/>
      <rect x="1030" y="462" width="200" height="10" rx="5" fill="#B8A084"/>
      <rect x="1044" y="472" width="12" height="60" rx="4" fill="url(#chrome)"/>
      <rect x="1204" y="472" width="12" height="60" rx="4" fill="url(#chrome)"/>
    </g>

    <!-- ADA grab bars: vertical at entry, horizontal at wall, bench-height -->
    <g fill="url(#chrome)">
      <rect x="1420" y="440" width="120" height="18" rx="9"/>
      <circle cx="1424" cy="449" r="14"/>
      <circle cx="1536" cy="449" r="14"/>

      <rect x="1046" y="360" width="18" height="120" rx="9"/>
      <circle cx="1055" cy="364" r="14"/>
      <circle cx="1055" cy="476" r="14"/>

      <rect x="1240" y="380" width="180" height="18" rx="9"/>
      <circle cx="1244" cy="389" r="14"/>
      <circle cx="1416" cy="389" r="14"/>
    </g>
  </g>

  <!-- ===== Vanity with knee clearance (left side) ===== -->
  <g>
    <!-- mirror -->
    <rect x="180" y="120" width="330" height="230" rx="10" fill="#2A4E9B" opacity="0.55"/>
    <rect x="180" y="120" width="330" height="230" rx="10" fill="none" stroke="#CFE0FB" stroke-opacity="0.45" stroke-width="4"/>
    <path d="M200 330 L400 140" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="40" stroke-linecap="round"/>

    <!-- sconces -->
    <circle cx="120" cy="200" r="18" fill="#FFE9B8" opacity="0.85"/>
    <circle cx="120" cy="200" r="60" fill="url(#sconce)"/>
    <circle cx="572" cy="200" r="18" fill="#FFE9B8" opacity="0.85"/>
    <circle cx="572" cy="200" r="60" fill="url(#sconce)"/>

    <!-- counter -->
    <rect x="140" y="430" width="410" height="26" rx="8" fill="#E7EDF8"/>
    <rect x="140" y="456" width="410" height="12" rx="4" fill="#B9C7DE"/>
    <!-- open knee clearance underneath: only side supports, no cabinet -->
    <rect x="150" y="468" width="14" height="132" fill="#9FB0CC" opacity="0.55"/>
    <rect x="526" y="468" width="14" height="132" fill="#9FB0CC" opacity="0.55"/>

    <!-- basin + lever faucet -->
    <ellipse cx="345" cy="430" rx="86" ry="16" fill="#0F2A5E" opacity="0.5"/>
    <rect x="330" y="374" width="30" height="12" rx="6" fill="url(#chrome)"/>
    <rect x="336" y="386" width="14" height="46" rx="7" fill="url(#chrome)"/>
    <rect x="356" y="372" width="46" height="10" rx="5" fill="url(#chrome)"/>
  </g>

  <!-- ===== Comfort-height toilet (center) ===== -->
  <g transform="translate(690 400)">
    <rect x="0" y="0" width="96" height="120" rx="14" fill="#E7EDF8"/>
    <rect x="10" y="14" width="76" height="10" rx="5" fill="#B9C7DE"/>
    <ellipse cx="48" cy="150" rx="62" ry="30" fill="#E7EDF8"/>
    <ellipse cx="48" cy="146" rx="44" ry="19" fill="#B9C7DE" opacity="0.6"/>
    <rect x="16" y="176" width="64" height="24" rx="8" fill="#CBD7EA"/>
    <!-- grab bar beside the toilet -->
    <g fill="url(#chrome)">
      <rect x="150" y="20" width="18" height="150" rx="9"/>
      <circle cx="159" cy="24" r="14"/>
      <circle cx="159" cy="166" r="14"/>
    </g>
  </g>

  <!-- Slip-resistant floor sheen -->
  <path d="M0 640 L1600 610 L1600 660 L0 700 Z" fill="#FFFFFF" opacity="0.04"/>
  <path d="M0 720 L1600 690 L1600 720 L0 760 Z" fill="#FFFFFF" opacity="0.03"/>
</svg>
